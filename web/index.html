<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aristarkus</title>
<link rel="preload" href="fonts/Tomorrow-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="fonts/Tomorrow-Bold.ttf" as="font" type="font/ttf" crossorigin>
<script>
  // send page errors to the server so they land in aristarkus-debug.log
  (() => {
    const report = message => fetch('/api/log', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message }) }).catch(() => {});
    addEventListener('error', e => report(`${e.message} at ${e.filename}:${e.lineno}:${e.colno}`));
    addEventListener('unhandledrejection', e => report(`unhandled rejection: ${e.reason && (e.reason.stack || e.reason)}`));
  })();
</script>
<style>
  /* Daemon Domain house style: tokens and recipes as in the site's site.css. */
  @font-face {
    font-family: 'Tomorrow';
    src: url('fonts/Tomorrow-Regular.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Tomorrow';
    src: url('fonts/Tomorrow-Bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root {
    color-scheme: dark;
    --bg: #000;
    --fg: #ffffff;
    --accent: #ffffff;
    --fg-rgb: 255, 255, 255;
    --bg-rgb: 0, 0, 0;
    --panel-rgb: 10, 15, 20;
    --glass-gradient: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.12) 0%,
      rgba(255, 255, 255, 0.05) 45%,
      rgba(0, 0, 0, 0.3) 50%,
      rgba(0, 0, 0, 0.6) 100%
    );
    --glass-border: 1px solid rgba(255, 255, 255, 0.3);
    --glass-shadow:
      0 0 15px rgba(255, 255, 255, 0.2),
      inset 0 1px 0 rgba(255, 255, 255, 0.4);
    --title-glow: drop-shadow(0 0 8px rgba(255, 255, 255, 0.5));
    --scroll-thumb: linear-gradient(180deg, #555, #333);
    --error: #ff9b9b;
    --success: #9dffc0;
    --radius: 12px;
    --transition: 600ms cubic-bezier(.2, .9, .2, 1);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #eeeeee;
    --fg: #111418;
    --accent: rgba(17, 20, 24, 0.35);
    --fg-rgb: 17, 20, 24;
    --bg-rgb: 255, 255, 255;
    --panel-rgb: 246, 247, 249;
    --glass-gradient: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.75) 0%,
      rgba(255, 255, 255, 0.35) 45%,
      rgba(17, 20, 24, 0.02) 50%,
      rgba(17, 20, 24, 0.06) 100%
    );
    --glass-border: 1px solid rgba(17, 20, 24, 0.16);
    --glass-shadow:
      0 4px 18px rgba(17, 20, 24, 0.14),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
    --title-glow: drop-shadow(0 0 6px rgba(17, 20, 24, 0.18));
    --scroll-thumb: linear-gradient(180deg, #c4c4c4, #dedede);
    --error: #b3261e;
    --success: #1b7a3e;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
  }
  body {
    height: 100vh;
    height: 100dvh;
    font-family: 'Tomorrow', sans-serif;
    font-size: 15px;
    line-height: 1.4;
    letter-spacing: 0.5px;
    color: rgba(var(--fg-rgb), 0.88);
    text-shadow: 0 1px 2px rgba(var(--bg-rgb), 0.8);
    background:
      radial-gradient(circle at 50% 120%, rgba(var(--fg-rgb), 0.25), rgba(var(--bg-rgb), 0) 60%),
      linear-gradient(180deg, rgba(var(--bg-rgb), 0.2), rgba(var(--bg-rgb), 0.95)),
      var(--bg);
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  button, input, select { font: inherit; letter-spacing: inherit; }

  .btn {
    color: var(--fg);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 16px;
    border: 1px solid transparent;
    background: transparent;
    box-shadow: none;
    transition: var(--transition);
    text-shadow: 0 1px 2px rgb(var(--bg-rgb));
    cursor: pointer;
  }
  .btn:hover:not(:disabled),
  .btn:focus-visible {
    color: var(--fg);
    background: rgba(var(--fg-rgb), 0.1);
    border-color: rgba(var(--fg-rgb), 0.3);
    box-shadow: 0 0 10px var(--accent);
    text-shadow: 0 0 5px var(--accent);
    transform: translateY(-2px);
    outline: none;
  }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .icon-btn {
    width: 40px;
    height: 40px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn svg { width: 18px; height: 18px; fill: currentColor; }

  input[type=text], select {
    min-width: 0;
    background: rgba(var(--bg-rgb), 0.45);
    color: var(--fg);
    border: 1px solid rgba(var(--fg-rgb), 0.22);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 16px;
    text-shadow: none;
    transition: var(--transition);
  }
  input[type=text]:focus, select:focus {
    outline: none;
    border-color: rgba(var(--fg-rgb), 0.55);
    box-shadow: 0 0 0 3px rgba(var(--fg-rgb), 0.08);
  }
  input::placeholder { color: rgba(var(--fg-rgb), 0.45); }
  option { background: rgb(var(--panel-rgb)); color: var(--fg); }
  input[type=checkbox] { accent-color: var(--fg); width: 16px; height: 16px; margin: 0; }

  .glass {
    background: rgba(var(--panel-rgb), 0.75);
    background-image: var(--glass-gradient);
    border: var(--glass-border);
    box-shadow: var(--glass-shadow);
    border-radius: var(--radius);
    backdrop-filter: blur(12px);
  }
  .scroll::-webkit-scrollbar { width: 10px; }
  .scroll::-webkit-scrollbar-track { background: rgba(var(--bg-rgb), 0.3); border-radius: 5px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border: 1px solid rgba(var(--fg-rgb), 0.2); border-radius: 8px; }
  .scroll { scrollbar-width: thin; scrollbar-color: rgba(var(--fg-rgb), 0.3) rgba(var(--bg-rgb), 0.3); }

  #top {
    position: fixed;
    left: max(16px, env(safe-area-inset-left));
    top: max(12px, env(safe-area-inset-top));
    right: 400px;
    pointer-events: none;
  }
  #headline {
    margin: 0;
    font-weight: 700;
    font-size: clamp(24px, 3vw, 36px);
    color: var(--fg);
    filter: var(--title-glow);
  }
  #crumbs {
    margin-top: 2px;
    pointer-events: auto;
    font-size: 14px;
    color: rgba(var(--fg-rgb), 0.55);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #crumbs a { color: rgba(var(--fg-rgb), 0.85); cursor: pointer; text-decoration: none; transition: var(--transition); }
  #crumbs a:hover { color: var(--fg); text-shadow: 0 0 5px var(--accent); }
  #crumbs span { margin: 0 5px; opacity: 0.5; }

  /* Below the theme switch, which owns the top-right corner. */
  #panel {
    position: fixed;
    top: calc(max(0.5rem, env(safe-area-inset-top)) + 48px);
    right: max(12px, env(safe-area-inset-right));
    bottom: max(12px, env(safe-area-inset-bottom));
    width: 372px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    transition: opacity var(--transition), transform var(--transition);
  }
  #panel.hidden { opacity: 0; transform: translateX(24px); pointer-events: none; }
  .sec { padding: 14px 18px; border-bottom: 1px solid rgba(var(--fg-rgb), 0.15); }
  .sec-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 10px; }
  .sec h2 { margin: 0; font-size: 14px; font-weight: 700; color: rgba(var(--fg-rgb), 0.62); }
  .sec-head .icon-btn { width: 32px; height: 32px; margin: -6px -8px -6px 0; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row + .row { margin-top: 8px; }
  .grow { flex: 1; }
  .muted { color: rgba(var(--fg-rgb), 0.55); }
  .meta { font-size: 12px; color: rgba(var(--fg-rgb), 0.55); }
  .stat { font-variant-numeric: tabular-nums; }
  #status { margin-top: 10px; display: block; }
  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; font-size: 14px; }
  .toggles label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .toggles label:has(input:disabled) { opacity: 0.5; cursor: not-allowed; }
  #sel .name { font-weight: 700; color: var(--fg); word-break: break-all; }
  #sel .path { font-size: 12px; color: rgba(var(--fg-rgb), 0.55); word-break: break-all; margin: 2px 0 6px; }
  #sel .btns { display: flex; gap: 4px; flex-wrap: wrap; margin: 8px -8px 0; }
  #logsec { flex: 1 0 220px; display: flex; flex-direction: column; border-bottom: 0; }
  #rates { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-bottom: 8px; font-size: 13px; }
  #rates span { white-space: nowrap; }
  #rates b { font-weight: 700; color: var(--fg); }
  #log { flex: 1 1 0; min-height: 0; overflow-y: auto; font-size: 13px; line-height: 1.6; margin: 0 -10px; padding: 0 10px; }
  #log div { display: flex; gap: 8px; white-space: nowrap; cursor: pointer; border-radius: 6px; padding: 0 4px; transition: background var(--transition); }
  #log div:hover { background: rgba(var(--fg-rgb), 0.08); }
  #log .k { width: 10px; flex: none; font-weight: 700; }
  #log .p { overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; flex: 1; color: rgba(var(--fg-rgb), 0.8); }
  #log .n { flex: none; color: rgba(var(--fg-rgb), 0.55); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
  .dot.ring { background: none; border: 2px solid; width: 10px; height: 10px; }
  .dot.folder { background: rgba(var(--fg-rgb), 0.12); border: 1px dashed rgba(var(--fg-rgb), 0.6); }

  #tip {
    position: fixed;
    z-index: 5;
    display: none;
    max-width: 360px;
    padding: 8px 12px;
    font-size: 13px;
    pointer-events: none;
    background-color: rgba(var(--panel-rgb), 0.92);
  }
  #tip b { color: var(--fg); word-break: break-all; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  #overlay div { text-align: center; color: rgba(var(--fg-rgb), 0.55); }
  #overlay strong { display: block; color: var(--fg); font-size: 20px; font-weight: 700; margin-bottom: 4px; filter: var(--title-glow); }
  #toggle {
    position: fixed;
    top: max(0.5rem, env(safe-area-inset-top));
    right: calc(max(0.5rem, env(safe-area-inset-right)) + 64px + 12px);
    z-index: 4;
  }
  #toggle[hidden] { display: none; }
  .err { color: var(--error); }

  /* Light/dark switch, added by theme.js (same rules as the site). */
  .theme-switch {
    position: fixed;
    top: max(0.5rem, env(safe-area-inset-top));
    right: max(0.5rem, env(safe-area-inset-right));
    z-index: 1001;
    width: 64px;
    height: 40px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 20px;
    color: rgba(var(--fg-rgb), 0.7);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: var(--transition);
  }
  .theme-switch:focus { outline: none; }
  .theme-switch:hover,
  .theme-switch:focus-visible { color: var(--fg); transform: translateY(-2px); }
  .theme-switch:active { transform: translateY(0) scale(0.97); }
  .theme-switch-track {
    position: relative;
    width: 52px;
    height: 26px;
    padding: 0 7px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid rgba(var(--fg-rgb), 0.3);
    border-radius: 13px;
    background: rgba(var(--panel-rgb), 0.6);
    box-shadow: inset 0 1px 2px rgba(var(--bg-rgb), 0.5);
    backdrop-filter: blur(6px);
    transition: var(--transition);
  }
  .theme-switch:hover .theme-switch-track,
  .theme-switch:focus-visible .theme-switch-track {
    background: rgba(var(--fg-rgb), 0.1);
    border-color: rgba(var(--fg-rgb), 0.45);
    box-shadow: 0 0 10px var(--accent);
  }
  .theme-switch-track > svg { width: 11px; height: 11px; fill: currentColor; opacity: 0.55; }
  .theme-switch-knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: var(--fg);
    color: var(--bg);
    box-shadow: 0 0 8px var(--accent);
    transition: transform var(--transition);
  }
  .theme-switch-knob svg { width: 12px; height: 12px; fill: currentColor; }
  .theme-switch[aria-checked="true"] .theme-switch-knob { transform: translateX(26px); }
  .theme-switch[aria-checked="true"] .knob-moon,
  .theme-switch[aria-checked="false"] .knob-sun { display: none; }

  @media (max-width: 720px) {
    #top { right: 140px; }
    #panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 55vh; }
    .sec { padding: 12px 14px; }
  }
  @media (hover: none) and (pointer: coarse) {
    .btn { min-height: 44px; }
    .icon-btn, .sec-head .icon-btn { width: 44px; height: 44px; }
    .theme-switch { height: 44px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, .theme-switch, .theme-switch-knob { transition: none !important; }
  }
</style>
<script src="theme.js"></script>
<script src="d3.min.js"></script>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>

<main role="main" aria-labelledby="headline">
<div id="top">
  <h1 id="headline">Aristarkus</h1>
  <nav id="crumbs" aria-label="Current folder"></nav>
</div>

<div id="overlay" role="status" aria-live="polite"><div><strong>Connecting…</strong><span id="ovsub"></span></div></div>
<div id="tip" class="glass"></div>
<button id="toggle" class="btn icon-btn" hidden aria-label="Show panel" title="Show panel">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
</button>

<aside id="panel" class="glass scroll" aria-label="Controls">
  <div class="sec">
    <div class="sec-head">
      <h2>Start folder</h2>
      <button class="btn icon-btn" id="hide" aria-label="Hide panel" title="Hide panel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></svg>
      </button>
    </div>
    <div class="row">
      <input type="text" id="rootIn" class="grow" spellcheck="false" placeholder="/some/folder" aria-label="Start folder">
      <button class="btn" id="scan">Scan</button>
    </div>
    <div class="row">
      <button class="btn" id="home">Home</button>
      <span class="grow"></span>
      <label class="muted" for="budget">detail</label>
      <select id="budget">
        <option value="8000">light</option>
        <option value="25000" selected>normal</option>
        <option value="70000">dense</option>
      </select>
    </div>
    <div class="meta stat" id="status" role="status" aria-live="polite">—</div>
  </div>

  <div class="sec" id="sel">
    <div class="sec-head"><h2>Selection</h2></div>
    <div class="muted">Hover or poke a sphere. Click a folder to dive in, click its empty bit to come back up.</div>
  </div>

  <div class="sec">
    <div class="sec-head"><h2>Display</h2></div>
    <div class="toggles">
      <label><input type="checkbox" id="optMotion"> organic motion</label>
      <label><input type="checkbox" id="optThreads" checked> activity threads</label>
      <label><input type="checkbox" id="optReads" checked> show reads</label>
      <label><input type="checkbox" id="optWrites" checked> show writes</label>
      <label><input type="checkbox" id="optLabels" checked> labels</label>
    </div>
    <div class="row" style="margin-top:10px">
      <input type="text" id="ignore" class="grow" spellcheck="false" placeholder="hide paths with... (comma separated)" aria-label="Hide activity on paths containing">
    </div>
  </div>

  <div class="sec">
    <div class="sec-head"><h2>Legend</h2></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="sec" id="logsec">
    <div class="sec-head"><h2>Live activity</h2></div>
    <div id="rates" class="stat" role="status" aria-live="off"></div>
    <div id="log" class="scroll"></div>
  </div>
</aside>
</main>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const WORLD = 1000;        // radius of the start folder in world units
const PAD = 0.06;          // folder radius = enclosing circle × (1 + PAD)
const GAP = 0.06;          // siblings are packed as if GAP × r bigger; each may drift within that margin
const EXPAND_PX = 70;      // fetch a collapsed folder's contents once it is this big on screen
const LAZY_BUDGET = 3000;
const PULSE_LIFE = 1.4, THREAD_LIFE = 2.6;

// activity keeps its colours in both themes, just deeper on light paper; `color` follows the theme
const KIND = {
  r: { label: 'read',   dark: '#22d3ee', light: '#0e7490', mark: 'R' },
  w: { label: 'write',  dark: '#ff9f1c', light: '#c2410c', mark: 'W' },
  c: { label: 'create', dark: '#84e08f', light: '#15803d', mark: '+' },
  d: { label: 'delete', dark: '#ff5470', light: '#be123c', mark: '−' },
};

const CATS = {
  image:   { color: '#c084fc', ext: 'png jpg jpeg gif webp svg bmp tif tiff heic avif ico psd kra xcf raw cr2 nef dng exr hdr' },
  video:   { color: '#fb7185', ext: 'mp4 mkv webm mov avi m4v flv wmv mpg mpeg ts' },
  audio:   { color: '#facc15', ext: 'mp3 flac wav ogg opus m4a aac aiff aif mid midi wv' },
  code:    { color: '#4ade80', ext: 'js mjs cjs ts tsx jsx py c h cc cpp hpp rs go java kt swift sh bash zsh fish lua rb php html htm css scss vue svelte qml gd cs glsl wgsl' },
  text:    { color: '#60a5fa', ext: 'md txt rst pdf doc docx odt rtf epub tex org csv xls xlsx ods ppt pptx odp' },
  config:  { color: '#93c5fd', ext: 'json yml yaml toml ini conf cfg xml plist desktop service lock env' },
  archive: { color: '#fb923c', ext: 'zip tar gz tgz xz bz2 zst 7z rar iso img deb rpm flatpak appimage whl jar' },
  model:   { color: '#2dd4bf', ext: 'blend blend1 obj fbx glb gltf stl ply usd usdz abc' },
  data:    { color: '#a78bfa', ext: 'sqlite sqlite3 db ldb log parquet npy npz pt pth safetensors gguf onnx bin dat pack idx' },
  binary:  { color: '#94a3b8', ext: 'so o a exe dll pyc wasm class ttf otf woff woff2 pak' },
  other:   { color: '#cbd5e1', ext: '' },
};
const EXT = new Map();
for (const [cat, v] of Object.entries(CATS)) for (const e of v.ext.split(' ')) if (e) EXT.set(e, cat);
function category(name) {
  const i = name.lastIndexOf('.');
  if (i <= 0) return 'other';
  return EXT.get(name.slice(i + 1).toLowerCase()) || 'other';
}

const canvas = $('#c'), ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
let T = d3.zoomIdentity;
let root = null, rootPath = '', rootPrefix = '/', gen = -1;
let frame = 0, dirty = true, hover = null, selected = null, focusNode = null;
const opts = { motion: false, threads: true, reads: true, writes: true, labels: true };
let ignore = [];

// ------------------------------------------------------------ tree model

function build(j, parent) {
  const n = {
    name: j.n, kind: j.k, size: j.s, count: j.m || 0, parent, children: null,
    r: 0, dx: 0, dy: 0, slack: 0, heat: 0,
    ph1: Math.random() * TAU, ph2: Math.random() * TAU,
    w1: 0.22 + Math.random() * 0.4, w2: 0.22 + Math.random() * 0.4,
  };
  n.cat = n.kind === 'f' ? category(n.name) : null;
  if (j.c) setChildren(n, j.c.map(c => build(c, n)));
  return n;
}

// Folders are monochrome glass in the site's ink; only files carry colour (their type).
// Rebuilt from the CSS tokens whenever theme.js flips the theme.
const PAL = {};
function readTheme() {
  const css = getComputedStyle(document.documentElement);
  const ink = css.getPropertyValue('--fg-rgb').trim(), paper = css.getPropertyValue('--bg-rgb').trim();
  const light = document.documentElement.dataset.theme === 'light';
  Object.assign(PAL, {
    d: [`rgba(${ink},.035)`, `rgba(${ink},.34)`],
    c: [`rgba(${ink},.1)`, `rgba(${ink},.55)`],
    o: [`rgba(${ink},.15)`, `rgba(${ink},.4)`],
    fileEdge: `rgba(${paper},.4)`,
    hover: `rgba(${ink},.6)`,
    selected: `rgb(${ink})`,
    label: `rgba(${ink},.92)`,
    labelMeta: `rgba(${ink},.55)`,
    shadow: `rgba(${paper},.9)`,
  });
  for (const v of Object.values(KIND)) v.color = light ? v.light : v.dark;
  renderLegend();
  dirty = true;
}

function setChildren(n, kids) {
  n.children = kids;
  n.byName = new Map();
  n.others = null;
  for (const c of kids) { if (c.kind === 'o') n.others = c; else n.byName.set(c.name, c); }
}

// radii in sqrt(bytes) units: file area ∝ size, folders enclose their children
function measure(n) {
  if (n.children && n.children.length) {
    for (const c of n.children) { measure(c); c.r *= 1 + GAP; }
    d3.packSiblings(n.children);
    const e = d3.packEnclose(n.children);
    for (const c of n.children) { c.r /= 1 + GAP; c.dx = c.x - e.x; c.dy = c.y - e.y; }
    n.r = e.r * (1 + PAD);
  } else {
    n.r = Math.sqrt(n.size) * (n.kind === 'c' ? 1.2 : 1);
  }
}
function scaleTree(n, k) {
  n.r *= k; n.dx *= k; n.dy *= k;
  if (n.children) for (const c of n.children) scaleTree(c, k);
}
function settle(n) {
  if (!n.children) return;
  for (const c of n.children) {
    c.slack = Math.max(0, n.r - Math.hypot(c.dx, c.dy) - c.r);
    settle(c);
  }
}
function layoutInto(n, radius) {
  measure(n);
  const k = radius / n.r;
  n.r = radius;
  if (n.children) for (const c of n.children) scaleTree(c, k);
  settle(n);
}

function pathOf(n) {
  const parts = [];
  for (let m = n.kind === 'o' ? n.parent : n; m && m.parent; m = m.parent) parts.push(m.name);
  return parts.length ? rootPrefix + parts.reverse().join('/') : rootPath;
}

// deepest loaded circle for a path: the file, the "+N smaller" circle, or the nearest folder
function resolve(path) {
  if (!root) return null;
  if (path !== rootPath && !path.startsWith(rootPrefix)) return null;
  const rel = path === rootPath ? '' : path.slice(rootPrefix.length);
  const parts = rel ? rel.split('/') : [];
  let n = root;
  for (let i = 0; i < parts.length; i++) {
    if (!n.children) break;
    const c = n.byName.get(parts[i]);
    if (!c) return (i === parts.length - 1 && n.others) ? n.others : n;
    n = c;
  }
  return n;
}

// ------------------------------------------------------------ loading

let inflight = 0;
function expand(n) {
  if (n.loading || n.failed || inflight >= 3) return;
  n.loading = true; inflight++;
  const myGen = gen;
  fetch(`/api/tree?budget=${LAZY_BUDGET}&path=${encodeURIComponent(pathOf(n))}`)
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => {
      if (myGen !== gen || n.kind !== 'c') return;
      n.kind = 'd';
      setChildren(n, (j.c || []).map(c => build(c, n)));
      const R = n.r;
      layoutInto(n, R);
      dirty = true;
    })
    .catch(() => { n.failed = true; })
    .finally(() => { n.loading = false; inflight--; });
}

async function status() { return (await fetch('/api/status')).json(); }
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function waitAndLoad() {
  root = null; hover = selected = focusNode = null; showSel(null); dirty = true;
  let st;
  for (;;) {
    try { st = await status(); } catch { overlay("Can't reach the server.", 'start it with: python3 aristarkus.py'); await sleep(1500); continue; }
    $('#rootIn').value = $('#rootIn').value || st.root;
    showStatus(st);
    if (!st.scanning) break;
    overlay(`Scanning ${st.root}`, `${fmtInt(st.files)} files · ${fmtInt(st.dirs)} folders · ${fmtBytes(st.bytes)}`);
    await sleep(400);
  }
  overlay('Laying out…', '');
  const budget = +$('#budget').value;
  const j = await (await fetch(`/api/tree?budget=${budget}&path=${encodeURIComponent(st.root)}`)).json();
  rootPath = st.root; rootPrefix = rootPath.endsWith('/') ? rootPath : rootPath + '/';
  gen = st.gen;
  $('#rootIn').value = rootPath;
  const r = build(j, null);
  r.name = rootPath;
  layoutInto(r, WORLD);
  root = r; focusNode = root;
  overlay(null);
  fitRoot(false);
  showStatus(st);
  crumbs();
}

async function setRoot(path) {
  const res = await fetch('/api/root', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path }) });
  const j = await res.json();
  if (!res.ok) { $('#status').innerHTML = `<span class="err">${esc(j.error)}</span>`; return; }
  $('#rootIn').value = j.root;
  waitAndLoad();
}

function showStatus(st) {
  let live;
  if (!st.watches && st.watchError) live = `<span class="err">no live activity: ${esc(st.watchError)}</span>`;
  else {
    live = `${fmtInt(st.watches)} folders watched`;
    if (st.watchFailed) live += ` · <span class="err" title="${esc(st.watchError || '')}">${fmtInt(st.watchFailed)} unwatched</span>`;
    if (!st.reads) live += '<br><span class="muted">this system reports changes, not reads</span>';
  }
  $('#status').innerHTML = `${fmtInt(st.files)} files · ${fmtInt(st.dirs)} folders · ${fmtBytes(st.bytes)}<br>${live}`;
  $('#status').title = `Aristarkus ${st.version} · ${st.platform} · live activity: ${st.watchMode}`;
  $('#optReads').disabled = !st.reads;
}
setInterval(async () => { if (root) try { showStatus(await status()); } catch {} }, 5000);

// ------------------------------------------------------------ positions + motion

// any two siblings sit at least GAP × (r1 + r2) apart, so drifting by at most GAP × r each
// never makes them touch; the 1/√2 keeps the combined x/y swing within that radius
function wob(c, t) {
  if (!opts.motion) return [0, 0];
  const a = Math.min(c.slack, c.r * GAP) * Math.SQRT1_2;
  const f = 1 + c.heat * 3;
  return [a * Math.sin(t * c.w1 * f + c.ph1), a * Math.cos(t * c.w2 * f + c.ph2)];
}

// world position of any node at time t, whether or not it was drawn this frame
function livePos(n, t) {
  if (n._f === frame) return [n._x, n._y];
  const chain = [];
  for (let m = n; m.parent; m = m.parent) chain.push(m);
  let x = 0, y = 0;
  for (let i = chain.length - 1; i >= 0; i--) {
    const c = chain[i], [ox, oy] = wob(c, t);
    x += c.dx + ox; y += c.dy + oy;
  }
  return [x, y];
}

// ------------------------------------------------------------ render

const labels = [];
let lastT = 0;

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  dirty = true;
}

function drawNode(n, x, y, t) {
  const k = T.k, sr = n.r * k, sx = x * k + T.x, sy = y * k + T.y;
  if (sr < 0.4 || sx + sr < 0 || sy + sr < 0 || sx - sr > W || sy - sr > H) return;
  n._x = x; n._y = y; n._f = frame;

  ctx.beginPath();
  ctx.arc(sx, sy, sr, 0, TAU);
  if (n.kind === 'f') {
    ctx.globalAlpha = 0.82;
    ctx.fillStyle = CATS[n.cat].color; ctx.fill();
    ctx.globalAlpha = 1;
    if (sr > 4) { ctx.strokeStyle = PAL.fileEdge; ctx.lineWidth = 1; ctx.stroke(); }
  } else {
    const [fill, stroke] = PAL[n.kind];
    ctx.fillStyle = fill; ctx.fill();
    if (sr > 1.5) {
      ctx.strokeStyle = stroke; ctx.lineWidth = 1;
      if (n.kind !== 'd' && sr > 6) ctx.setLineDash([3, 3]);
      if (n.loading) ctx.globalAlpha = 0.4 + 0.4 * Math.sin(t * 8);
      ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
  }
  if (n === hover || n === selected) {
    ctx.strokeStyle = n === selected ? PAL.selected : PAL.hover;
    ctx.lineWidth = n === selected ? 2 : 1.5;
    ctx.stroke();
  }
  if (n.kind === 'c' && sr > EXPAND_PX) expand(n);
  if (opts.labels && sr > (n.kind === 'f' ? 28 : 34)) labels.push([n, sx, sy, sr]);

  if (n.children && sr > 3) {
    for (const c of n.children) {
      const [ox, oy] = wob(c, t);
      drawNode(c, x + c.dx + ox, y + c.dy + oy, t);
    }
  }
}

function fit(text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  let lo = 0, hi = text.length;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (ctx.measureText(text.slice(0, mid) + '…').width <= maxW) lo = mid; else hi = mid - 1;
  }
  return lo ? text.slice(0, lo) + '…' : '';
}

// nested folders put their names at nearly the same spot; keep the outermost
const placed = [];
function place(text, x, y, fs) {
  const w = ctx.measureText(text).width / 2 + 2, h = fs * 0.65;
  for (const [x0, y0, w0, h0] of placed) if (Math.abs(x - x0) < w + w0 && Math.abs(y - y0) < h + h0) return false;
  placed.push([x, y, w, h]);
  return true;
}

function drawLabels() {
  placed.length = 0;
  labels.sort((a, b) => b[3] - a[3]);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = PAL.shadow;
  const max = Math.min(labels.length, 140);
  for (let i = 0; i < max; i++) {
    const [n, sx, sy, sr] = labels[i];
    const isFile = n.kind === 'f' || n.kind === 'o';
    const fs = Math.max(10, Math.min(15, sr * (isFile ? 0.2 : 0.11)));
    ctx.font = `${isFile ? 400 : 700} ${fs}px Tomorrow, sans-serif`;
    const name = n === root ? rootPath : n.name;
    if (isFile) {
      const s = fit(name, sr * 1.7);
      if (!s || !place(s, sx, sy, fs)) continue;
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(10,12,15,.92)';   // dark ink on the file's colour, in both themes
      ctx.fillText(s, sx, sy);
    } else {
      const ly = sy - sr + fs * 1.3;
      const s = fit(name, sr * 1.1);
      if (!s || !place(s, sx, ly, fs)) continue;
      ctx.shadowBlur = 4;
      ctx.fillStyle = PAL.label;
      ctx.fillText(s, sx, ly);
      if (sr > 120) {
        const ms = Math.max(9, fs * 0.8), size = fmtBytes(n.size);
        ctx.font = `400 ${ms}px Tomorrow, sans-serif`;
        if (!place(size, sx, ly + fs * 1.15, ms)) continue;
        ctx.fillStyle = PAL.labelMeta;
        ctx.fillText(size, sx, ly + fs * 1.15);
      }
    }
  }
  ctx.shadowBlur = 0;
}

// ------------------------------------------------------------ activity

const pulses = [], threads = [], heated = new Set();
let lastNode = null, threadFlip = 1;

function pulse(n, kind, count, t) {
  const p0 = n._pulse;
  if (p0 && p0.kind === kind && t - p0.t0 < 0.3) { p0.count += count; }
  else {
    const p = { n, kind, count, t0: t };
    n._pulse = p;
    pulses.push(p);
    if (pulses.length > 1500) pulses.splice(0, pulses.length - 1500);
  }
  n.heat = 1; heated.add(n);
  if (opts.threads && lastNode && lastNode !== n) {
    threads.push({ a: lastNode, b: n, kind, t0: t, bend: (threadFlip = -threadFlip) * (0.15 + Math.random() * 0.25) });
    if (threads.length > 260) threads.splice(0, threads.length - 260);
  }
  lastNode = n;
}

function drawThreads(t) {
  ctx.lineCap = 'round';
  for (let i = threads.length - 1; i >= 0; i--) {
    const th = threads[i], age = (t - th.t0) / THREAD_LIFE;
    if (age >= 1 || !opts.threads) { threads.splice(i, 1); continue; }
    const [ax, ay] = livePos(th.a, t), [bx, by] = livePos(th.b, t);
    const x1 = ax * T.k + T.x, y1 = ay * T.k + T.y, x2 = bx * T.k + T.x, y2 = by * T.k + T.y;
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1;
    const cx = mx - dy * th.bend, cy = my + dx * th.bend;
    // the thread grows from a to b, then fades
    const grow = Math.min(1, age * 4);
    ctx.globalAlpha = 0.55 * (1 - age) ** 1.4;
    ctx.strokeStyle = KIND[th.kind].color;
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    if (grow >= 1) ctx.quadraticCurveTo(cx, cy, x2, y2);
    else {
      // partial quadratic via de Casteljau
      const qx = x1 + (cx - x1) * grow, qy = y1 + (cy - y1) * grow;
      const rx = cx + (x2 - cx) * grow, ry = cy + (y2 - cy) * grow;
      ctx.quadraticCurveTo(qx, qy, qx + (rx - qx) * grow, qy + (ry - qy) * grow);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawPulses(t) {
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i], age = (t - p.t0) / PULSE_LIFE;
    if (age >= 1) { pulses.splice(i, 1); if (p.n._pulse === p) p.n._pulse = null; continue; }
    const [x, y] = livePos(p.n, t);
    const sx = x * T.k + T.x, sy = y * T.k + T.y;
    const sr = Math.max(p.n.r * T.k, 2.5);
    if (sx + sr + 40 < 0 || sy + sr + 40 < 0 || sx - sr - 40 > W || sy - sr - 40 > H) continue;
    const e = 1 - (1 - age) ** 3;
    const col = KIND[p.kind].color;
    const boost = Math.min(1, 0.5 + Math.log10(1 + p.count) * 0.4);
    if (age < 0.35) {
      ctx.globalAlpha = 0.35 * (1 - age / 0.35) * boost;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = (1 - age) ** 1.5 * boost;
    ctx.strokeStyle = col;
    ctx.lineWidth = 0.6 + 1.8 * (1 - age);
    ctx.beginPath(); ctx.arc(sx, sy, sr + (5 + Math.min(sr, 120) * 0.35) * e, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function coolDown(dt) {
  for (const n of heated) {
    n.heat = Math.max(0, n.heat - dt * 0.6);
    if (!n.heat) heated.delete(n);
  }
}

// event stream
const logItems = [];
const rate = { r: 0, w: 0, c: 0, d: 0 }, shown = { r: 0, w: 0, c: 0, d: 0 };
let logDirty = false, dropped = 0, overflowed = false;

function connect() {
  const es = new EventSource('/api/events');
  es.onmessage = ev => {
    const m = JSON.parse(ev.data);
    const t = performance.now() / 1000;
    dropped += m.drop || 0;
    if (m.overflow) overflowed = true;
    for (const [kind, path, count] of m.e) {
      rate[kind] += count;
      if (kind === 'r' ? !opts.reads : !opts.writes) continue;
      if (ignore.length && ignore.some(s => path.includes(s))) continue;
      logItems.push([kind, path, count]);
      logDirty = true;
      const n = resolve(path);
      if (n) pulse(n, kind, count, t);
    }
    if (logItems.length > 200) logItems.splice(0, logItems.length - 200);
  };
}

setInterval(() => {
  Object.assign(shown, rate);
  for (const k in rate) rate[k] = 0;
  const extra = (dropped ? ` · ${fmtInt(dropped)} merged` : '') + (overflowed ? ' · <span class="err">queue overflow</span>' : '');
  $('#rates').innerHTML = Object.entries(KIND).map(([k, v]) => `<span><i class="dot" style="background:${v.color}"></i><b>${fmtInt(shown[k])}</b>/s ${v.label}</span>`).join('') + `<span class="muted">${extra}</span>`;
  dropped = 0; overflowed = false;
}, 1000);

setInterval(() => {
  if (!logDirty) return;
  logDirty = false;
  const rows = logItems.slice(-60).reverse();
  $('#log').innerHTML = rows.map(([k, p, c]) => {
    const rel = p.startsWith(rootPrefix) ? p.slice(rootPrefix.length) : p;
    return `<div data-p="${esc(p)}" title="${esc(p)}"><span class="k" style="color:${KIND[k].color}">${KIND[k].mark}</span><span class="p">&lrm;${esc(rel)}&lrm;</span>${c > 1 ? `<span class="n">×${c}</span>` : ''}</div>`;
  }).join('');
}, 250);

$('#log').addEventListener('click', e => {
  const row = e.target.closest('[data-p]');
  if (!row) return;
  const n = resolve(row.dataset.p);
  if (n) { select(n); zoomTo(n.children ? n : n.parent || n); }
});

// ------------------------------------------------------------ main loop

let lastRaf = 0;
function loop(now) {
  lastRaf = performance.now();
  requestAnimationFrame(loop);
  tick(now);
}
// background panes may never fire requestAnimationFrame; keep drawing at a low rate there
setInterval(() => { if (performance.now() - lastRaf > 300) tick(performance.now()); }, 100);

function tick(now) {
  const t = now / 1000, dt = Math.min(0.1, t - lastT);
  lastT = t;
  coolDown(dt);
  if (!root) {
    if (dirty) { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H); dirty = false; }
    return;
  }
  if (!opts.motion && !pulses.length && !threads.length && !heated.size && !dirty && !inflight) return;
  dirty = false;
  frame++;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  labels.length = 0;
  drawNode(root, 0, 0, t);
  drawThreads(t);
  drawPulses(t);
  drawLabels();
}

// ------------------------------------------------------------ interaction

const zoom = d3.zoom()
  .scaleExtent([0.1, 1e10])
  .on('zoom', e => { T = e.transform; dirty = true; });
d3.select(canvas).call(zoom).on('dblclick.zoom', null);

// the part of the window the panel doesn't cover: beside it on wide screens, above it on narrow ones
function viewBox() {
  const panel = $('#panel');
  if (panel.classList.contains('hidden')) return { cx: W / 2, cy: H / 2 + 14, size: Math.min(W, H - 40) };
  if (W > 720) {
    const w = W - panel.offsetWidth - 24;
    return { cx: w / 2, cy: H / 2 + 14, size: Math.min(w, H - 40) };
  }
  const top = 70, h = H - panel.offsetHeight - 8 - top;
  return { cx: W / 2, cy: top + h / 2, size: Math.min(W - 16, h) };
}

function fitRoot(animate) { zoomTo(root, animate); }

function zoomTo(n, animate = true) {
  if (!n) return;
  focusNode = n;
  const [x, y] = livePos(n, performance.now() / 1000);
  const v = viewBox();
  const k = v.size / (2 * n.r * 1.08);
  const target = d3.zoomIdentity.translate(v.cx - x * k, v.cy - y * k).scale(k);
  const sel = d3.select(canvas);
  if (animate) sel.transition().duration(850).ease(d3.easeCubicInOut).call(zoom.transform, target);
  else sel.call(zoom.transform, target);
  crumbs();
}

function pick(mx, my) {
  if (!root || root._f !== frame) return null;
  const wx = (mx - T.x) / T.k, wy = (my - T.y) / T.k;
  if ((wx - root._x) ** 2 + (wy - root._y) ** 2 > root.r ** 2) return null;
  let n = root;
  outer: while (n.children) {
    for (let i = n.children.length - 1; i >= 0; i--) {
      const c = n.children[i];
      if (c._f === frame && (wx - c._x) ** 2 + (wy - c._y) ** 2 <= c.r * c.r) { n = c; continue outer; }
    }
    break;
  }
  return n;
}

let downAt = null;
canvas.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener('pointermove', e => {
  const n = e.buttons ? null : pick(e.clientX, e.clientY);
  if (n !== hover) { hover = n; dirty = true; }
  const tip = $('#tip');
  if (!n) { tip.style.display = 'none'; return; }
  tip.innerHTML = describe(n, true);
  tip.style.display = 'block';
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(e.clientX + 14, W - tw - 8) + 'px';
  tip.style.top = Math.min(e.clientY + 14, H - th - 8) + 'px';
});
canvas.addEventListener('pointerleave', () => { hover = null; $('#tip').style.display = 'none'; dirty = true; });
canvas.addEventListener('click', e => {
  if (downAt && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4) return;
  const n = pick(e.clientX, e.clientY);
  if (!n) { if (root) zoomTo(root); return; }
  select(n);
  if (n.kind === 'd' || n.kind === 'c') zoomTo(n === focusNode && n.parent ? n.parent : n);
});

function select(n) { selected = n; dirty = true; showSel(n); }

function describe(n, short) {
  const kind = { f: CATS[n.cat] ? n.cat + ' file' : 'file', d: 'folder', c: 'folder', o: 'small files' }[n.kind];
  const count = n.kind === 'f' ? '' : ` · ${fmtInt(n.count || (n.children ? n.children.length : 0))} files`;
  const name = n === root ? rootPath : n.name;
  return short
    ? `<b>${esc(name)}</b><br><span class="muted">${fmtBytes(n.size)} · ${kind}${count}</span>`
    : `<div class="name">${esc(name)}</div><div class="path">${esc(pathOf(n))}</div><div class="stat">${fmtBytes(n.size)} · ${kind}${count}</div>`;
}

function showSel(n) {
  const box = $('#sel');
  const head = '<div class="sec-head"><h2>Selection</h2></div>';
  if (!n) { box.innerHTML = head + '<div class="muted">Hover or poke a sphere. Click a folder to dive in, click its empty bit to come back up.</div>'; return; }
  const isDir = n.kind === 'd' || n.kind === 'c';
  box.innerHTML = `${head}${describe(n, false)}<div class="btns">
    ${isDir ? '<button class="btn" data-a="zoom">Zoom here</button><button class="btn" data-a="root">Start from here</button>' : '<button class="btn" data-a="up">Show folder</button>'}
    <button class="btn" data-a="copy">Copy path</button></div>`;
  box.querySelector('.btns').onclick = e => {
    const a = e.target.dataset.a;
    if (a === 'zoom') zoomTo(n);
    if (a === 'up') zoomTo(n.parent || root);
    if (a === 'root') setRoot(pathOf(n));
    if (a === 'copy') navigator.clipboard?.writeText(pathOf(n));
  };
}

function crumbs() {
  const el = $('#crumbs');
  if (!focusNode) { el.innerHTML = ''; return; }
  const chain = [];
  for (let m = focusNode; m; m = m.parent) chain.unshift(m);
  el.innerHTML = '';
  chain.forEach((m, i) => {
    if (i) el.insertAdjacentHTML('beforeend', '<span>/</span>');
    const a = document.createElement('a');
    a.textContent = m === root ? rootPath : m.name;
    a.onclick = () => zoomTo(m);
    el.appendChild(a);
  });
}

// ------------------------------------------------------------ controls

$('#scan').onclick = () => setRoot($('#rootIn').value.trim());
$('#rootIn').addEventListener('keydown', e => { if (e.key === 'Enter') setRoot($('#rootIn').value.trim()); });
$('#home').onclick = async () => setRoot((await status()).home);
$('#budget').onchange = () => { if (rootPath) setRoot(rootPath); };
for (const [id, key] of [['optMotion', 'motion'], ['optThreads', 'threads'], ['optReads', 'reads'], ['optWrites', 'writes'], ['optLabels', 'labels']]) {
  $('#' + id).onchange = e => { opts[key] = e.target.checked; dirty = true; };
}
$('#ignore').oninput = e => { ignore = e.target.value.split(',').map(s => s.trim()).filter(Boolean); };
$('#hide').onclick = () => { $('#panel').classList.add('hidden'); $('#toggle').hidden = false; dirty = true; };
$('#toggle').onclick = () => { $('#panel').classList.remove('hidden'); $('#toggle').hidden = true; dirty = true; };
$('#optMotion').checked = opts.motion;
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape' && focusNode && focusNode.parent) zoomTo(focusNode.parent);
});

function renderLegend() {
  $('#legend').innerHTML =
    Object.entries(CATS).map(([k, v]) => `<span><i class="dot" style="background:${v.color}"></i>${k}</span>`).join('') +
    '<span><i class="dot folder"></i>folder (zoom to open)</span>' +
    Object.values(KIND).map(v => `<span><i class="dot ring" style="border-color:${v.color}"></i>${v.label}</span>`).join('');
}
addEventListener('themechange', readTheme);
readTheme();

// ------------------------------------------------------------ utils

function overlay(title, sub) {
  const o = $('#overlay');
  if (!title) { o.style.display = 'none'; return; }
  o.style.display = 'flex';
  o.querySelector('strong').textContent = title;
  $('#ovsub').textContent = sub || '';
}
function fmtBytes(b) {
  if (!b) return '0 B';
  const u = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
  const i = Math.min(u.length - 1, Math.floor(Math.log(b) / Math.log(1024)));
  const v = b / 1024 ** i;
  return (v >= 100 || i === 0 ? v.toFixed(0) : v.toFixed(1)) + ' ' + u[i];
}
function fmtInt(n) { return (n || 0).toLocaleString('en-US'); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

addEventListener('resize', resize);
resize();
connect();
waitAndLoad();
requestAnimationFrame(loop);
window.aristarkus = { get T() { return T; }, get root() { return root; }, get frame() { return frame; } };  // console handle
})();
</script>
